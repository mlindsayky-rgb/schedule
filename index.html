<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer Schedule</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;font-size:14px;color:#1a1a2e;background:#faf8f4}
:root{
  --navy:#1a1a2e;--navy-mid:#2d2d5e;--navy-hover:#3a3a6e;
  --purple:#4a2c6e;--green:#2d6a4f;--green-soft:#40916c;--green-pale:#d8f3dc;
  --amber:#b5510a;--amber-pale:#fef3e2;--amber-mid:#f4a261;
  --cream:#faf8f4;--cream-dark:#f0ece4;--gray:#6b7280;--gray-pale:#f1f0ee;
  --white:#ffffff;--border:#ddd8d0;
  --teal:#1a6b6b;--teal-pale:#e0f2f1;--teal-border:#80cbc4;
  --red:#b91c1c;--red-pale:#fef2f2;--red-border:#fca5a5;
  --tennis:#d8f3dc;--tennis-border:#b7e4c7;--tennis-text:#1b4332;
  --cc-bg:#f3e8ff;--cc-border:#d8b4fe;--cc-text:#581c87;
  --life-bg:#dbeafe;--life-border:#93c5fd;--life-text:#1e3a5f;
}
/* PIN */
#pin-screen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:24px}
#pin-screen h1{color:#fff;font-size:22px;font-weight:bold;letter-spacing:.06em;text-align:center}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:8px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:transparent;transition:background .15s}
.pin-dot.filled{background:#fff;border-color:#fff}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pin-btn{width:72px;height:72px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:22px;font-family:Georgia,serif;cursor:pointer;transition:background .15s}
.pin-btn:hover{background:rgba(255,255,255,.18)}
.pin-btn:active{background:rgba(255,255,255,.28)}
.pin-btn.zero{grid-column:2}
.pin-btn.del{font-size:16px}
#pin-error{color:#fca5a5;font-size:13px;font-style:italic;text-align:center;min-height:20px}
/* SYNC */
#sync-bar{background:#2d2d5e;color:rgba(255,255,255,.75);font-size:10px;text-align:center;padding:4px;letter-spacing:.04em;font-style:italic}
#sync-bar.ok{background:#2d6a4f}
#sync-bar.err{background:#7f1d1d}
/* APP */
.app{max-width:100%;background:var(--cream);min-height:100vh}
.tabs{display:flex;flex-wrap:wrap;background:var(--navy)}
.tab{padding:9px 12px;border:none;background:none;cursor:pointer;font-size:10px;font-family:Georgia,serif;letter-spacing:.05em;color:rgba(255,255,255,.55);text-transform:uppercase;font-weight:600;border-bottom:3px solid transparent;transition:color .15s,background .15s;white-space:nowrap}
.tab:hover{color:#fff;background:var(--navy-hover)}
.tab.active{color:#fff;font-weight:bold;border-bottom:3px solid rgba(255,255,255,.5);background:var(--navy-mid)}
.panel{display:none}.panel.active{display:block}
.app-body{padding:10px 12px}
.grid{display:grid;gap:8px}
/* DAY BLOCKS */
.day-block{border:1px solid var(--border);border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(26,26,46,.06)}
.day-block.pto-day{border-color:#fca5a5}
.day-block.pto-done{border-color:#86efac}
.day-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--navy)}
.day-name{color:#fff;font-size:13px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase}
.day-hours{color:rgba(255,255,255,.38);font-size:10px;font-style:italic;margin-left:7px}
.day-open-count{color:rgba(255,255,255,.6);font-size:11px;font-style:italic}
.day-slots{padding:10px;background:var(--cream)}
/* SLOTS */
.slot{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:4px;margin-bottom:5px;cursor:pointer;border:1px solid transparent;transition:filter .15s}
.slot:hover{filter:brightness(.93)}
.slot.available{background:var(--tennis);border-color:var(--tennis-border)}
.slot.booked{background:var(--tennis);border-color:var(--tennis-border)}
.slot.partial{background:var(--tennis);border-color:var(--tennis-border)}
.slot.full{background:var(--tennis);border-color:var(--tennis-border)}
.slot.fixed{background:var(--tennis);border-color:var(--tennis-border)}
.slot.blocked{background:#f1f0ee;border-color:#d1d5db}
.slot.pto-sub-needed{background:var(--red-pale);border-color:var(--red-border)}
.slot.pto-sub-done{background:#f0fdf4;border-color:#86efac}
.slot.pto-notify-needed{background:var(--red-pale);border-color:var(--red-border)}
.slot.pto-notify-done{background:#f0fdf4;border-color:#86efac}
.slot.pto-dim{background:var(--gray-pale);border-color:#e5e7eb;opacity:.45;cursor:default}
.slot.readonly{cursor:default}.slot.readonly:hover{filter:none}
/* CC BAR */
.cc-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:4px;border:1px dashed var(--cc-border);background:var(--cc-bg);margin-top:8px}
.cc-bar-time{font-size:11px;color:var(--cc-text);min-width:90px;font-style:italic;flex-shrink:0}
.cc-bar-label{font-size:12px;color:var(--cc-text);font-weight:500}
.cc-bar-badge{font-size:10px;padding:1px 8px;border-radius:20px;background:#e9d5ff;color:#581c87;margin-left:auto}
/* SLOT PARTS */
.slot-time{font-size:11px;color:var(--gray);min-width:90px;font-style:italic;flex-shrink:0}
.slot-body{flex:1;min-width:0}
.slot-lbl{font-size:13px;color:var(--navy);font-weight:600}
.slot-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.tbadge{font-size:10px;padding:1px 8px;border-radius:20px;font-family:Georgia,serif}
.type-private{background:#c5cae9;color:#1a237e}.type-group{background:#b2dfdb;color:#004d40}
.type-liveball{background:#f8bbd0;color:#880e4f}.type-camp{background:#ffe0b2;color:#e65100}
.type-adult-team{background:#ce93d8;color:#4a148c}.type-hp-clinic{background:#b39ddb;color:#311b92}
.type-blocked{background:#d1d5db;color:#374151}
.pips{display:flex;gap:2px;align-items:center}
.pip{width:7px;height:7px;border-radius:50%;border:1px solid #9ca3af}
.pip.on{background:var(--amber);border-color:var(--amber)}
.fill-lbl{font-size:11px;color:var(--gray);font-style:italic}
.slot-right{display:flex;align-items:center;flex-shrink:0;gap:5px}
.rchip{font-size:10px;padding:2px 9px;border-radius:20px;background:#fff8e1;color:#5d4037;border:1px solid #ffe082;display:inline-flex;align-items:center;gap:5px}
.rchip button{background:none;border:none;cursor:pointer;color:#9b1c1c;font-size:11px;padding:0}
.fnote{font-size:10px;color:var(--tennis-text);background:rgba(45,106,79,.12);border-radius:20px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}
.send-btn{width:36px;height:36px;border-radius:8px;background:var(--green-soft);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;transition:background .15s,transform .1s;flex-shrink:0}
.send-btn:hover{background:var(--green);transform:scale(1.08)}
/* PTO BANNER */
.pto-banner{background:#7f1d1d;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px}
.pto-bl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pto-tag{background:#dc2626;color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.pto-dates{color:rgba(255,255,255,.85);font-style:italic}
.pto-prog{color:rgba(255,255,255,.7);font-size:11px}
.pto-nav{display:flex;align-items:center;gap:6px}
.pto-nb{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;font-family:Georgia,serif}
.pto-nb:disabled{opacity:.35;cursor:default}
.pto-nlbl{font-size:11px;color:rgba(255,255,255,.8);min-width:90px;text-align:center;font-style:italic}
.pbr{font-size:10px;padding:3px 9px;border-radius:20px;background:#dc2626;color:#fff;font-weight:600;white-space:nowrap}
.pbg{font-size:10px;padding:3px 9px;border-radius:20px;background:var(--green-soft);color:#fff;font-weight:600;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
/* WEEK NAV */
.week-nav{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0 4px;margin-bottom:8px}
.week-nav-btn{background:var(--navy);color:#fff;border:none;border-radius:5px;padding:5px 13px;font-size:13px;cursor:pointer;font-family:Georgia,serif;transition:background .15s}
.week-nav-btn:hover{background:var(--navy-hover)}
.week-nav-lbl{font-size:12px;color:var(--gray);font-style:italic;min-width:180px;text-align:center}
/* EVENT PILLS on schedule */
.event-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill-camp{background:var(--life-bg);color:var(--life-text);border:1px solid var(--life-border);font-size:11px;padding:4px 11px;border-radius:20px;font-weight:600;cursor:pointer;transition:background .15s}
.pill-camp:hover{background:#bfdbfe}
.pill-vacation{background:var(--life-bg);color:var(--life-text);border:1px solid var(--life-border);font-size:11px;padding:4px 11px;border-radius:20px;font-weight:600;cursor:pointer;transition:background .15s}
.pill-vacation:hover{background:#bfdbfe}
/* REQUEST BANNER */
.req-banner{background:#dc2626;color:#fff;padding:7px 16px;font-size:12px;font-family:Georgia,serif;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.req-banner:hover{background:#b91c1c}
.req-banner-dot{width:8px;height:8px;border-radius:50%;background:#fff;flex-shrink:0}
/* LAYOUT */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.leg{display:flex;gap:8px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--gray);font-style:italic}
.ld{width:9px;height:9px;border-radius:50%}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 20px;border-radius:5px;cursor:pointer;font-size:13px;font-family:Georgia,serif;font-weight:600;border:none;transition:background .15s;background:#1a1a2e;color:#fff}
.btn:hover{background:#3a3a6e}
.btn-sm{padding:7px 14px;font-size:12px;min-width:76px;text-align:center}
.bcx{background:#4b5563;color:#fff}.bcx:hover{background:#374151}
.bdg{background:#9b1c1c;color:#fff}.bdg:hover{background:#7a1515}
.bpto{background:#7f1d1d;color:#fff}.bpto:hover{background:#991b1b}
.bptoc{background:#4b5563;color:#fff}
input,select,textarea{padding:8px 11px;border:1.5px solid #c5c0b8;border-radius:5px;font-size:13px;font-family:Georgia,serif;background:#fff;color:#1a1a2e;width:100%}
textarea{resize:vertical}
.mo{position:fixed;inset:0;background:rgba(26,26,46,.55);display:flex;align-items:center;justify-content:center;z-index:100}
.md{background:#faf8f4;border-radius:10px;padding:1.6rem;width:390px;max-width:95vw;border:1.5px solid #ddd8d0;max-height:92vh;overflow-y:auto;box-shadow:0 10px 40px rgba(26,26,46,.25)}
.md h3{font-size:18px;font-weight:bold;color:#1a1a2e;margin-bottom:18px}
.ma{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--border)}
.f{margin-bottom:14px}
.f label,.fl{font-size:11px;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.ch{font-size:11px;color:#6b7280;margin-top:4px;font-style:italic}
.ph{font-size:10px;color:var(--amber);margin-top:3px;font-style:italic;display:none}
.mp{background:#f0ece4;border-radius:6px;padding:12px 14px;font-size:13px;color:#1a1a2e;line-height:1.6;border-left:3px solid var(--green-soft);margin-bottom:14px;font-style:italic}
.ppk{border:1.5px solid #c5c0b8;border-radius:6px;overflow:hidden;margin-bottom:8px;background:#fff}
.pki{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;border-bottom:1px solid #ede9e1;transition:background .1s}
.pki:last-child{border-bottom:none}
.pki:hover{background:var(--green-pale)}
.pki.sel{background:#e8eaf6}
.pki.dis{opacity:.35;cursor:default;pointer-events:none}
.pkn{font-size:13px;color:#1a1a2e}
.pkc{font-size:16px;color:var(--green-soft);font-weight:bold}
.pke{padding:12px 14px;font-size:12px;color:#6b7280;font-style:italic}
.rr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:30px;align-items:center}
/* PEOPLE */
.pc{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;background:#fff}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;color:#fff;flex-shrink:0}
.dp{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill{font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);cursor:pointer;user-select:none;font-family:Georgia,serif;background:#fff;color:#6b7280}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.req-btn{width:30px;height:30px;border-radius:6px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;transition:background .15s,transform .1s;flex-shrink:0}
.req-btn.none{background:#e5e7eb;color:#6b7280}.req-btn.none:hover{background:#d1d5db;transform:scale(1.05)}
.req-btn.has{background:#dc2626;color:#fff}.req-btn.has:hover{background:#b91c1c;transform:scale(1.05)}
.req-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;background:#fff}
.req-item-body{flex:1;min-width:0}
.req-item-note{font-size:13px;color:var(--navy);line-height:1.5}
.req-item-date{font-size:10px;color:var(--gray);font-style:italic;margin-top:3px}
.req-close-btn{width:28px;height:28px;border-radius:5px;border:none;background:#f0fdf4;color:var(--green-soft);cursor:pointer;font-size:16px;font-weight:bold;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.req-close-btn:hover{background:#dcfce7}
.req-suggestion{background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#92400e;display:flex;align-items:center;gap:8px}
.req-suggestion label{cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:#92400e;font-family:Georgia,serif}
.people-search{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:5px;font-size:13px;font-family:Georgia,serif;background:#fff;color:var(--navy);margin-bottom:12px}
.people-search:focus{outline:2px solid var(--navy);border-color:var(--navy)}
/* NOTES / ACTIVITY */
.nb{border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:10px;background:#fff}
.an{background:#f0ece4;border-radius:4px;padding:9px 13px;font-size:11px;color:#6b7280;margin-bottom:14px;border-left:3px solid var(--green-soft);font-style:italic}
/* CHILDCARE */
.cd{border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden;background:#fff}
.cdh{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--navy)}
.cdt{font-weight:bold;font-size:13px;color:#fff;letter-spacing:.06em;text-transform:uppercase}
.cdhr{font-size:12px;color:rgba(255,255,255,.6);font-style:italic}
.cdb{padding:12px}
.cdnl{font-size:11px;color:#6b7280;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.cdsr{display:flex;justify-content:flex-end;margin-top:6px}
.cdo{opacity:.45}
.cctg{font-size:10px;padding:4px 12px;border-radius:20px;border:1.5px solid rgba(255,255,255,.5);cursor:pointer;background:transparent;color:rgba(255,255,255,.8);font-family:Georgia,serif;font-weight:500}
.cctg.on{background:var(--green-soft);border-color:var(--green-soft);color:#fff}
.pnab{width:100%;margin-top:8px;font-size:12px;background:#1a1a2e;color:#fff;padding:8px;border-radius:5px;cursor:pointer;border:none;font-family:Georgia,serif;font-weight:600}
/* LIFE TAB */
.life-card{border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(26,26,46,.06)}
.life-card-header{padding:11px 14px;display:flex;align-items:center;justify-content:space-between}
.life-card-header.camp{background:#fff7ed;border-bottom:1px solid #fed7aa}
.life-card-header.vacation{background:#ecfeff;border-bottom:1px solid #a5f3fc}
.life-card-title{font-weight:bold;font-size:14px;color:var(--navy)}
.life-card-subtitle{font-size:11px;color:var(--gray);font-style:italic;margin-top:2px}
.life-card-type{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600;letter-spacing:.04em}
.life-card-type.camp{background:#d97706;color:#fff}
.life-card-type.vacation{background:#0e7490;color:#fff}
.life-card-body{padding:12px 14px;font-size:13px;color:var(--navy);line-height:1.6}
.life-card-meta{font-size:11px;color:var(--gray);font-style:italic;margin-top:4px}
.life-card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kids-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.kid-pill{font-size:11px;padding:3px 11px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;user-select:none;font-family:Georgia,serif;background:#fff;color:#6b7280;transition:background .15s}
.kid-pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.day-check{display:flex;gap:6px;flex-wrap:wrap}
.day-check label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--navy);cursor:pointer;padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:#fff;transition:background .15s}
.day-check label:hover{background:var(--green-pale)}
.day-check input[type=checkbox]{width:auto}
.pto-link-btn{background:#2d6a4f;color:#fff;border:none;border-radius:5px;padding:6px 14px;font-size:12px;font-family:Georgia,serif;cursor:pointer;font-weight:600}
.pto-link-btn:hover{background:#1a4a35}
.pto-linked-badge{font-size:11px;padding:3px 10px;border-radius:20px;background:#d1fae5;color:#065f46;font-style:italic}
.archived-toggle{text-align:center;padding:10px;font-size:12px;color:var(--gray);cursor:pointer;font-style:italic;text-decoration:underline}
.role-badge{position:fixed;bottom:12px;right:12px;background:rgba(26,26,46,.7);color:rgba(255,255,255,.6);font-size:10px;padding:4px 10px;border-radius:20px;font-family:Georgia,serif;font-style:italic;z-index:50;cursor:pointer}
</style>
</head>
<body>
<div id="pin-screen">
  <div><h1>Summer Schedule</h1><p style="color:rgba(255,255,255,.6);font-size:13px;font-style:italic;margin-top:6px;text-align:center">Enter your PIN to continue</p></div>
  <div class="pin-dots"><div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div><div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div></div>
  <div id="pin-error"></div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinTap('1')">1</button><button class="pin-btn" onclick="pinTap('2')">2</button><button class="pin-btn" onclick="pinTap('3')">3</button>
    <button class="pin-btn" onclick="pinTap('4')">4</button><button class="pin-btn" onclick="pinTap('5')">5</button><button class="pin-btn" onclick="pinTap('6')">6</button>
    <button class="pin-btn" onclick="pinTap('7')">7</button><button class="pin-btn" onclick="pinTap('8')">8</button><button class="pin-btn" onclick="pinTap('9')">9</button>
    <button class="pin-btn zero" onclick="pinTap('0')">0</button><button class="pin-btn del" onclick="pinDel()">⌫</button>
  </div>
</div>
<div class="role-badge" id="role-badge" style="display:none" onclick="lockApp()">Lock</div>
<div id="sync-bar" style="display:none">Connecting...</div>
<div class="app" id="main-app" style="display:none">
<div class="tabs">
  <button class="tab active" id="tab-schedule" onclick="st('schedule')">TENNIS</button>
  <button class="tab" id="tab-childcare" onclick="st('childcare')">KIDS</button>
  <button class="tab" id="tab-people" onclick="st('people')" style="display:none">CLIENTS</button>

function linkVacationToPTO(id){
  const e=S.lifeEvents.find(x=>x.id===id);if(!e)return;
  if(pto.active){
    if(!confirm(`PTO is already active (${pto.startDate} to ${pto.endDate}). Replace with vacation dates?`))return;
  }
  pto.active=true;pto.startDate=e.startDate;pto.endDate=e.endDate;
  pto.subs={};pto.notified={};pto.viewWeekOffset=0;
  // Auto-mark vacation days as childcare day off
  applyVacationToChildcare(e.startDate,e.endDate);
  save();cm();renderSchedule();renderPTOBanner();
  alert('PTO activated! Childcare days in this range have been marked as Day Off.');
}

function applyVacationToChildcare(startStr,endStr){
  const cur=new Date(startStr+'T12:00:00');
  const end=new Date(endStr+'T12:00:00');
  while(cur<=end){
    const dow=cur.getDay();
    if(dow>=1&&dow<=5){
      const dayName=ALLDAYS[dow-1];// Mon=0 in ALLDAYS
      if(!S.childcare[dayName])S.childcare[dayName]={...DCC};
      S.childcare[dayName].active=false;
    }
    cur.setDate(cur.getDate()+1);
  }
}

function lifeCard(e,isArchived=false){
  const isCamp=e.type==='camp';
  const kidsStr=isCamp&&e.kids?.length?e.kids.join(', '):'';
  const daysStr=isCamp&&e.days?.length?e.days.join(', '):'';
  const timesStr=isCamp&&e.startTime?`${e.startTime} – ${e.endTime}`:'';
  const dateStr=`${fmtDateLong(e.startDate)}${e.endDate&&e.endDate!==e.startDate?' – '+fmtDateLong(e.endDate):''}`;
  const ptoLinked=!isCamp&&pto.active&&pto.startDate===e.startDate;
  return`<div class="life-card" style="${isArchived?'opacity:.6':''}">
    <div class="life-card-header ${e.type}">
      <div>
        <div class="life-card-title">${e.title}</div>
        <div class="life-card-subtitle">${dateStr}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="life-card-type ${e.type}">${e.type}</span>
        ${ptoLinked?'<span class="pto-linked-badge">PTO active</span>':''}
      </div>
    </div>
    <div class="life-card-body">
      ${isCamp?`<div class="life-card-meta">Days: ${daysStr||'—'} &nbsp;·&nbsp; Times: ${timesStr||'—'} &nbsp;·&nbsp; Kids: ${kidsStr||'—'}</div>`:''}
      ${e.notes?`<div style="margin-top:6px;font-style:italic;color:var(--gray);font-size:12px">${e.notes}</div>`:''}
      <div class="life-card-actions">
        ${!isCamp&&!ptoLinked&&!isArchived?`<button class="pto-link-btn" onclick="linkVacationToPTO(${e.id})">Activate PTO for these dates</button>`:''}
        <button class="btn btn-sm bcx" onclick="openEditLifeEvent(${e.id})">Edit</button>
        <button class="btn btn-sm bdg" onclick="deleteLifeEvent(${e.id})">Delete</button>
      </div>
    </div>
  </div>`;
}

function saveLifeEvent(type){
  const title=document.getElementById('le-title')?.value?.trim();
  const start=document.getElementById('le-start')?.value;
  const end=document.getElementById('le-end')?.value;
  if(!title){alert('Please enter a name.');return;}
  if(!start||!end||start>end){alert('Please enter valid dates.');return;}
  const e={id:S.nextId++,type,title,startDate:start,endDate:end,notes:document.getElementById('le-notes')?.value?.trim()||'',archived:false};
  if(type==='camp'){
    e.days=[...document.querySelectorAll('.le-day:checked')].map(x=>x.value);
    e.startTime=document.getElementById('le-stime')?.value?.trim()||'';
    e.endTime=document.getElementById('le-etime')?.value?.trim()||'';
    e.kids=[...document.querySelectorAll('#le-kids .kid-pill.on')].map(x=>x.textContent);
  }
  S.lifeEvents.push(e);save();cm();renderLife();renderSchedule();
  if(type==='vacation'){
    setTimeout(()=>{
      if(confirm(`Activate PTO for ${fmtDateLong(start)} – ${fmtDateLong(end)}?\n\nThis will flag those weeks for subs and mark childcare as Day Off.`)){
        linkVacationToPTO(e.id);
      }
    },300);
  }
}

function updateLifeEvent(id,type){
  const e=S.lifeEvents.find(x=>x.id===id);if(!e)return;
  e.title=document.getElementById('le-title')?.value?.trim()||e.title;
  e.startDate=document.getElementById('le-start')?.value||e.startDate;
  e.endDate=document.getElementById('le-end')?.value||e.endDate;
  e.notes=document.getElementById('le-notes')?.value?.trim()||'';
  if(type==='camp'){
    e.days=[...document.querySelectorAll('.le-day:checked')].map(x=>x.value);
    e.startTime=document.getElementById('le-stime')?.value?.trim()||'';
    e.endTime=document.getElementById('le-etime')?.value?.trim()||'';
    e.kids=[...document.querySelectorAll('#le-kids .kid-pill.on')].map(x=>x.textContent);
  }
  save();cm();renderLife();renderSchedule();
}

function deleteLifeEvent(id){
  if(!confirm('Delete this event?'))return;
  S.lifeEvents=S.lifeEvents.filter(e=>e.id!==id);
  save();cm();renderLife();renderSchedule();
}

// ── PTO ──
function ptoDates(){if(!pto.active||!pto.startDate||!pto.endDate)return[];const dates=[],cur=new Date(pto.startDate+'T12:00:00'),end=new Date(pto.endDate+'T12:00:00');while(cur<=end){const dow=cur.getDay();if(dow>=1&&dow<=5)dates.push(cur.toISOString().slice(0,10));cur.setDate(cur.getDate()+1);}return dates;}
function ptoWeeks(){const dates=ptoDates();if(!dates.length)return[];const weeks=[];let cur=[],lastM=null;dates.forEach(d=>{const dt=new Date(d+'T12:00:00'),dow=dt.getDay(),m=new Date(dt);m.setDate(dt.getDate()-(dow-1));const ms=m.toISOString().slice(0,10);if(ms!==lastM){if(cur.length)weeks.push(cur);cur=[];lastM=ms;}cur.push(d);});if(cur.length)weeks.push(cur);return weeks;}
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function dayInPTOForWeek(day,weekMonday){
  if(!pto.active)return false;
  const dates=ptoDates();
  return dates.some(d=>{
    const dt=new Date(d+'T12:00:00');
    const mon=mondayOf(dt);
    return isoDate(mon)===isoDate(weekMonday)&&DN[dt.getDay()]===day;
  });
}
function ptoProg(){const dates=ptoDates();let total=0,done=0;S.slots.forEach(s=>{const inP=dates.some(d=>DN[new Date(d+'T12:00:00').getDay()]===s.day);if(!inP)return;const st2=ss(s),l=LT[s.type];if(l&&l.fixed){total++;if(pto.subs[s.id])done++;}else if(st2==='booked'||st2==='partial'||st2==='full'){total++;if(pto.notified[s.id])done++;}});return{total,done};}
function renderPTOBanner(){
  const bn=document.getElementById('pto-banner');
  if(role!=='mike'){bn.style.display='none';return;}
  const btn=document.getElementById('pto-btn');
  const lbl=document.getElementById('pto-active-lbl');
  if(!pto.active){
    bn.style.display='none';
    if(btn){btn.textContent='PTO';btn.className='btn btn-sm bpto';btn.style.minWidth='60px';btn.onclick=openPTO;}
    if(lbl)lbl.style.display='none';
    return;
  }
  const wks=ptoWeeks(),nw=wks.length,{total,done}=ptoProg(),wi=Math.min(pto.viewWeekOffset,nw-1),wd=wks[wi]||[];
  const ws=wd[0]?fmtDate(new Date(wd[0]+'T12:00:00')):'',we=wd[wd.length-1]?fmtDate(new Date(wd[wd.length-1]+'T12:00:00')):'';
  bn.style.display='flex';
  if(btn){btn.textContent='Clear PTO';btn.className='btn btn-sm bptoc';btn.style.minWidth='80px';btn.onclick=clearPTO;}
  if(lbl)lbl.style.display='block';
  bn.innerHTML=`<div class="pto-bl"><span class="pto-tag">PTO ACTIVE</span><span class="pto-dates">${fmtDateLong(pto.startDate)} \u2013 ${fmtDateLong(pto.endDate)}</span><span class="pto-prog">${done}/${total} handled</span></div><div class="pto-nav"><button class="pto-nb" onclick="ptoNav(-1)" ${wi===0?'disabled':''}>&#8592;</button><span class="pto-nlbl">Week ${wi+1}/${nw}<br><span style="font-size:10px">${ws}${we&&we!==ws?' \u2013 '+we:''}</span></span><button class="pto-nb" onclick="ptoNav(1)" ${wi>=nw-1?'disabled':''}>&#8594;</button></div>`;
}
function ptoNav(d){const wks=ptoWeeks();pto.viewWeekOffset=Math.max(0,Math.min(wks.length-1,pto.viewWeekOffset+d));save();renderSchedule();renderPTOBanner();}
function openPTO(){if(pto.active){clearPTO();return;}const today=isoDate(new Date());sm(`<h3>&#127774; Set PTO Dates</h3><p style="font-size:13px;color:#6b7280;font-style:italic;margin-bottom:16px">Mon\u2013Fri in this range get flagged. Weekends ignored.</p><div class="f"><label>Start date</label><input id="ps" type="date" value="${today}"></div><div class="f"><label>End date</label><input id="pe" type="date" value="${today}"></div><div class="ma"><button class="btn btn-sm bcx" onclick="cm()">Cancel</button><button class="btn btn-sm bpto" onclick="actPTO()">Activate PTO</button></div>`);}
function actPTO(){const s=document.getElementById('ps').value,e=document.getElementById('pe').value;if(!s||!e||s>e){alert('Please enter a valid date range.');return;}pto.active=true;pto.startDate=s;pto.endDate=e;pto.subs={};pto.notified={};pto.viewWeekOffset=0;save();cm();renderSchedule();renderPTOBanner();}
function clearPTO(){pto.active=false;pto.startDate=null;pto.endDate=null;pto.subs={};pto.notified={};pto.viewWeekOffset=0;save();renderSchedule();renderPTOBanner();}
function openSubModal(sid){const s=S.slots.find(x=>x.id===sid);if(!s)return;const cur=pto.subs[sid]||'',last=Object.values(pto.subs).filter(Boolean).pop()||'';const po=S.people.length?`<div class="ppk" style="max-height:180px;overflow-y:auto">${S.people.map(p=>`<div class="pki" onclick="subSel(${sid},'${p.name.replace(/'/g,"\\'")}')">${p.name}</div>`).join('')}</div>`:'';sm(`<h3>&#128101; Assign Sub</h3><p style="font-size:13px;color:#6b7280;font-style:italic;margin-bottom:14px">${s.label} \u2014 ${s.day}</p>${last&&last!==cur?`<button class="btn btn-sm" style="width:100%;background:#2d6a4f;margin-bottom:10px" onclick="subSel(${sid},'${last.replace(/'/g,"\\'")}')">Use last sub: ${last}</button>`:''}${po}<div class="f" style="margin-top:8px"><label>Or type a name</label><input id="sub-in" placeholder="Coach name" value="${cur}"></div><div class="ma">${cur?`<button class="btn btn-sm bdg" onclick="clrSub(${sid})">Remove sub</button>`:''}<button class="btn btn-sm bcx" onclick="cm()">Cancel</button><button class="btn btn-sm" onclick="svSub(${sid})">Save</button></div>`);}

function svSub(sid){const n=document.getElementById('sub-in')?.value?.trim();if(!n){alert('Enter a sub name.');return;}pto.subs[sid]=n;save();cm();renderSchedule();renderPTOBanner();}
function clrSub(sid){delete pto.subs[sid];save();cm();renderSchedule();renderPTOBanner();}
function openNotifyModal(sid){const s=S.slots.find(x=>x.id===sid);if(!s)return;const msg=vmsg(),enc=encodeURIComponent(msg);const links=s.roster.map(ln=>{const p=S.people.find(x=>gln(x.name)===ln||x.name===ln);if(p&&cp(p.phone))return`<a href="sms:${cp(p.phone)}?body=${enc}" style="display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border:1.5px solid #ddd8d0;border-radius:6px;font-size:13px;font-family:Georgia,serif;margin-bottom:8px;color:#1a1a2e;text-decoration:none;background:#faf8f4"><span>${p.name}</span><span style="color:#6b7280;font-size:11px;font-style:italic">${cp(p.phone)} \u203a</span></a>`;return`<div style="padding:8px 12px;border:1px solid #ddd8d0;border-radius:6px;font-size:12px;color:#6b7280;font-style:italic;margin-bottom:6px">${ln} \u2014 no phone on file</div>`;}).join('');sm(`<h3>&#9992; Cancel Lesson</h3><div class="mp">${msg}</div><p style="font-size:11px;color:var(--gray);font-style:italic;margin-bottom:10px">Tap name to open in Messages:</p>${links||'<div style="font-size:12px;color:#6b7280;margin-bottom:10px">No client linked yet.</div>'}<div class="ma"><button class="btn btn-sm bcx" onclick="cm()">Cancel</button><button class="btn btn-sm" onclick="mkN(${sid})">Mark as notified</button></div>`);}
function mkN(sid){pto.notified[sid]=true;save();cm();renderSchedule();renderPTOBanner();}
function mkAllN(day){S.slots.forEach(s=>{if(s.day!==day)return;const st2=ss(s);if(!isF(s.type)&&(st2==='booked'||st2==='partial'||st2==='full'))pto.notified[s.id]=true;});save();renderSchedule();renderPTOBanner();}

function renderSchedule(){
  renderPTOBanner();updateReqBanner();
  renderWeekLabel();
  // Event pills: show for viewed week, PLUS next week reminder when on current week
  const viewedEvents=eventsInWeek(getViewMonday());
  const nextEvents=weekOffset===0?eventsNextWeek().filter(e=>!viewedEvents.find(v=>v.id===e.id)):[];
  const allPills=[...viewedEvents,...nextEvents.filter(e=>!viewedEvents.find(v=>v.id===e.id))];
  renderEventPills('event-pills',allPills);
  // Setup controls
  if(role==='mike'){
    document.getElementById('sched-controls').innerHTML=`<button class="btn btn-sm bpto" onclick="openPTO()" id="pto-btn">PTO</button><button class="btn btn-sm" onclick="openAddSlot()">+ Add slot</button>`;
    renderPTOBanner();// re-run to wire pto-btn if just created
  }
  const grid=document.getElementById('schedule-grid');
  const viewMon=getViewMonday();
  const bd={};DAYS.forEach(d=>bd[d]=[]);S.slots.forEach(s=>{if(bd[s.day])bd[s.day].push(s)});DAYS.forEach(d=>bd[d].sort((a,b)=>a.startM-b.startM));

  grid.innerHTML=DAYS.map(day=>{
    const slots=bd[day],open=slots.filter(s=>ss(s)==='available').length,hrs=fhr(slots.reduce((a,s)=>a+shr(s),0));

    const ccb=cc&&cc.active?`<div class="cc-bar"><span class="cc-bar-time">${cc.start} \u2013 ${cc.end}</span><span class="cc-bar-label">Childcare${campBadge}</span><span class="cc-bar-badge">Coverage</span></div>`:'';
    const isPTO=pto.active&&dayInPTOForWeek(day,viewMon)&&m;
    const acts=slots.filter(s=>{const st2=ss(s),l=LT[s.type];return(l&&l.fixed)||(st2==='booked'||st2==='partial'||st2==='full');});
    const allDone=isPTO&&acts.length>0&&acts.every(s=>{const l=LT[s.type];return l&&l.fixed?!!pto.subs[s.id]:!!pto.notified[s.id];});
    const hasPL=isPTO&&slots.some(s=>{const st2=ss(s);return!isF(s.type)&&(st2==='booked'||st2==='partial'||st2==='full')&&!pto.notified[s.id];});
    return`<div class="day-block${isPTO?(allDone?' pto-done':' pto-day'):''}">

        <span class="day-open-count">${isPTO?'<span style="color:#fca5a5;font-size:11px;font-style:italic">PTO</span>':open?open+' open':''}</span>
      </div>
      <div class="day-slots">
        ${slots.map(s=>{
          const st2=ss(s),l=LT[s.type]||LT.blocked,cap=l.cap,fil=s.roster.length,av=st2==='available';
          if(isPTO){
            if(l.fixed){const sub=pto.subs[s.id];return`<div class="slot ${sub?'pto-sub-done':'pto-sub-needed'}" onclick="openSubModal(${s.id})"><span class="slot-time">${sdsp(s)}</span><div class="slot-body"><div class="slot-lbl">${s.label}</div><div class="slot-meta"><span class="tbadge ${l.cls}">${l.label}</span></div></div><div class="slot-right">${sub?`<span class="pbg">&#10003; ${sub}</span>`:`<span class="pbr">Sub needed</span>`}</div></div>`;}
            if(st2==='booked'||st2==='partial'||st2==='full'){const nt=pto.notified[s.id];return`<div class="slot ${nt?'pto-notify-done':'pto-notify-needed'}" onclick="openNotifyModal(${s.id})"><span class="slot-time">${sdsp(s)}</span><div class="slot-body"><div class="slot-lbl">${s.label}</div><div class="slot-meta"><span class="tbadge ${l.cls}">${l.label}</span></div></div><div class="slot-right">${nt?`<span class="pbg">&#10003; Notified</span>`:`<span class="pbr">Cancel lesson</span>`}</div></div>`;}
            return`<div class="slot pto-dim"><span class="slot-time">${sdsp(s)}</span><div class="slot-body"><div class="slot-lbl" style="color:#9ca3af">${s.label}</div></div></div>`;
          }

          if(claim&&m){
            return`<div class="slot" style="background:#fff7ed;border-color:#fed7aa;cursor:pointer" onclick="openClaimModal(${s.id})">
              <span class="slot-time">${sdsp(s)}</span>
              <div class="slot-body">
                <div class="slot-lbl">${s.label}</div>
                <div class="slot-meta"><span class="tbadge ${l.cls}">${l.label}</span><span style="font-size:11px;color:#d97706;font-style:italic;margin-left:4px">Claimed by ${claim.name}</span></div>

          return`<div class="slot ${st2}${m?'':' readonly'}"${m?` onclick="editSlot(${s.id})"`:''}>
            <span class="slot-time">${sdsp(s)}</span>
            <div class="slot-body"><div class="slot-lbl">${s.label}</div>
              <div class="slot-meta"><span class="tbadge ${l.cls}">${l.label}</span>
                ${l.fixed?`<span class="fnote">&#x1F512; Fixed</span>`:`<div style="display:flex;align-items:center;gap:4px">${rpips(fil,cap)}<span class="fill-lbl">${fil}/${cap}</span></div>${s.roster.length?`<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:2px">${s.roster.map(r=>`<span class="rchip">${r}</span>`).join('')}</div>`:''}`}
              </div>
            </div>
            <div class="slot-right">${av&&m?`<button class="send-btn" onclick="event.stopPropagation();notifySlot('${day}',${s.id})">&#x2708;</button>`:''}</div>
          </div>`;
        }).join('')}
        ${hasPL?`<button class="pnab" onclick="mkAllN('${day}')">Mark all ${day} lessons notified</button>`:''}
        ${ccb}
        ${m&&!isPTO?`<div style="padding:6px 2px 2px"><button class="btn btn-sm" onclick="openAddSlot('${day}')" style="font-size:10px">+ Add to ${day}</button></div>`:''}

  }).join('');
}

// ── PEOPLE PICKER ──
function autoLbl(){const e=document.getElementById('e-label');if(!e)return;if(_ps.length===0){if(e.value.includes('\u2014')||e.value==='Lesson')e.value='Lesson';return;}const n=_ps.map(pid=>{const p=S.people.find(x=>x.id===pid);return p?gln(p.name):'';}).filter(Boolean);e.value=`Lesson \u2014 ${n.join(', ')}`;}
function buildReqSuggestion(){const suggestions=_ps.map(pid=>{const p=S.people.find(x=>x.id===pid);if(!p)return null;const reqs=openReqs(pid);if(!reqs.length)return null;return{pid,name:p.name,reqs};}).filter(Boolean);if(!suggestions.length)return'';return suggestions.map(sg=>`<div class="req-suggestion"><span>&#10067;</span><label><input type="checkbox" id="close-req-${sg.pid}" checked style="width:auto;margin-right:4px">Close ${sg.name}'s open request${sg.reqs.length>1?'s':''}?</label></div>`).join('');}
function bPPk(sid){const s=S.slots.find(x=>x.id===sid);if(!s)return'';const cap=LT[s.type]?.cap||1,ac=_ps.length>=cap;if(!S.people.length)return`<div class="pke">No people yet.</div>`;return`<div class="ppk">${S.people.map(p=>{const sel=_ps.includes(p.id),dis=!sel&&ac;return`<div class="pki ${sel?'sel':''} ${dis?'dis':''}" onclick="togPP(${sid},${p.id})"><span class="pkn">${p.name}</span>${sel?'<span class="pkc">\u2713</span>':''}</div>`;}).join('')}</div>`;}
function bRC(sid){if(!_ps.length)return`<span style="font-size:11px;color:var(--gray);font-style:italic">No one selected yet</span>`;return _ps.map(pid=>{const p=S.people.find(x=>x.id===pid);return`<span class="rchip">${p?p.name:'?'} <button onclick="togPP(${sid},${pid})">\u2715</button></span>`;}).join('');}
function togPP(sid,pid){const s=S.slots.find(x=>x.id===sid);if(!s)return;const cap=LT[s.type]?.cap||1,idx=_ps.indexOf(pid);if(idx>=0)_ps.splice(idx,1);else{if(_ps.length>=cap)return;_ps.push(pid);}const pe=document.getElementById('slot-ppk');if(pe)pe.innerHTML=bPPk(sid);const ce=document.getElementById('slot-rc');if(ce)ce.innerHTML=bRC(sid);autoLbl();const rs=document.getElementById('req-suggestion-area');if(rs)rs.innerHTML=buildReqSuggestion();}
function editSlot(id){if(role!=='mike')return;const s=S.slots.find(x=>x.id===id);if(!s)return;const l=LT[s.type]||LT.blocked,cap=l.cap;_ps=[];s.roster.forEach(n=>{const p=S.people.find(x=>x.name===n||gln(x.name)===n);if(p&&!_ps.includes(p.id))_ps.push(p.id);});const ss2=`${Math.floor(s.startM/60)}:${String(s.startM%60).padStart(2,'0')}`,es=`${Math.floor(s.endM/60)}:${String(s.endM%60).padStart(2,'0')}`;const rs=l.fixed?`<div style="font-size:11px;color:#6b3f9e;font-style:italic;padding:6px 0">Fixed \u2014 no roster needed</div>`:`<div class="f"><div class="fl">Roster (${cap} spot${cap!==1?'s':''})</div><div id="slot-rc" class="rr">${bRC(id)}</div><div id="slot-ppk">${bPPk(id)}</div></div><div id="req-suggestion-area">${buildReqSuggestion()}</div>`;const stSec=l.fixed?'':`<div class="f"><label>Status</label><select id="e-status"><option value="auto" ${s.status!=='blocked'&&s.status!=='booked'?'selected':''}>Auto</option><option value="booked" ${s.status==='booked'?'selected':''}>Booked</option><option value="blocked" ${s.status==='blocked'?'selected':''}>Blocked</option></select></div>`;sm(`<h3>Edit Slot</h3><div class="f"><label>Label</label><input id="e-label" value="${s.label}"></div><div style="display:flex;gap:8px;margin-bottom:14px"><div style="flex:1"><div class="fl">Start</div><input id="e-start" value="${ss2}"></div><div style="flex:1"><div class="fl">End</div><input id="e-end" value="${es}"></div></div><div class="f"><label>Type</label><select id="e-type" onchange="uch()">${Object.entries(LT).map(([k,v])=>`<option value="${k}" ${s.type===k?'selected':''}>${v.label}${v.fixed?' \u2014 fixed':` (max ${v.cap})`}</option>`).join('')}</select><div class="ch" id="cap-hint">${l.fixed?'Fixed \u2014 no tracking':`Capacity: ${cap}`}</div></div>${stSec}${rs}<div class="ma"><button class="btn btn-sm bdg" onclick="delSlot(${id})">Delete</button><button class="btn btn-sm bcx" onclick="cm()">Cancel</button><button class="btn btn-sm" onclick="svSlot(${id})">Save</button></div>`);}
function uch(){const t=document.getElementById('e-type')?.value,l=LT[t],el=document.getElementById('cap-hint');if(el)el.textContent=l?.fixed?'Fixed \u2014 no tracking':`Capacity: ${l?.cap||1}`;}
function svSlot(id){if(role!=='mike')return;const s=S.slots.find(x=>x.id===id);if(!s)return;s.label=document.getElementById('e-label').value;s.startM=pti(document.getElementById('e-start').value);s.endM=pti(document.getElementById('e-end').value);const nt=document.getElementById('e-type').value;if(nt!==s.type){s.type=nt;if(isF(nt)){s.roster=[];s.status='fixed';}else{const nc=LT[nt]?.cap||1;_ps=_ps.slice(0,nc);s.status='auto';}}if(!isF(s.type)){s.roster=_ps.map(pid=>{const p=S.people.find(x=>x.id===pid);return p?gln(p.name):'';}).filter(Boolean);const se=document.getElementById('e-status');if(se){const v=se.value;s.status=v==='auto'?'auto':v;}_ps.forEach(pid=>{const cb=document.getElementById(`close-req-${pid}`);if(cb&&cb.checked){openReqs(pid).forEach(r=>{r.closed=true;});}});}save();cm();renderSchedule();renderPeople();}
function delSlot(id){if(role!=='mike')return;S.slots=S.slots.filter(s=>s.id!==id);save();cm();renderSchedule();}
function openAddSlot(def='Monday'){if(role!=='mike')return;sm(`<h3>Add Slot</h3><div class="f"><label>Day</label><select id="n-day">${DAYS.map(d=>`<option value="${d}" ${d===def?'selected':''}>${d}</option>`).join('')}</select></div><div style="display:flex;gap:8px;margin-bottom:14px"><div style="flex:1"><div class="fl">Start</div><input id="n-start" placeholder="10:00"></div><div style="flex:1"><div class="fl">End</div><input id="n-end" placeholder="11:30"></div></div><div class="f"><label>Label</label><input id="n-label" placeholder="e.g. Lesson \u2014 Smith"></div><div class="f"><label>Type</label><select id="n-type" onchange="ach()">${Object.entries(LT).map(([k,v])=>`<option value="${k}">${v.label}${v.fixed?' \u2014 fixed':` (max ${v.cap})`}</option>`).join('')}</select><div class="ch" id="add-cap-hint">Capacity: 1</div></div><div class="ma"><button class="btn btn-sm bcx" onclick="cm()">Cancel</button><button class="btn btn-sm" onclick="addSlot()">Add</button></div>`);}
function ach(){const t=document.getElementById('n-type')?.value,l=LT[t],el=document.getElementById('add-cap-hint');if(el)el.textContent=l?.fixed?'Fixed \u2014 no tracking':`Capacity: ${l?.cap||1}`;}
function addSlot(){if(role!=='mike')return;const type=document.getElementById('n-type').value;const s={id:S.nextId++,day:document.getElementById('n-day').value,startM:pti(document.getElementById('n-start').value),endM:pti(document.getElementById('n-end').value),label:document.getElementById('n-label').value,type,status:isF(type)?'fixed':'auto',roster:[]};S.slots.push(s);save();cm();renderSchedule();}
function notifySlot(day,sid){if(role!=='mike')return;const slot=S.slots.find(s=>s.id===sid);if(!slot)return;const interested=S.people.filter(p=>p.notifyAll||p.days.includes(day));if(!interested.length){sm(`<h3>No One to Notify</h3><p style="font-size:13px;color:#6b7280;margin-bottom:12px">No people marked as interested in ${day}.</p><div class="ma"><button class="btn btn-sm bcx" onclick="cm()">Close</button></div>`);return;}const msg=nmsg(slot,day),enc=encodeURIComponent(msg);const links=interested.map(p=>`<a href="sms:${cp(p.phone)}?body=${enc}" style="display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border:1.5px solid #ddd8d0;border-radius:6px;font-size:13px;font-family:Georgia,serif;margin-bottom:8px;color:#1a1a2e;text-decoration:none;background:#faf8f4"><span>${p.name}</span><span style="color:#6b7280;font-size:11px;font-style:italic">${cp(p.phone)} \u203a</span></a>`).join('');sm(`<h3>&#x2708; Notify \u2014 ${day}</h3><div class="mp">${msg}</div><p style="font-size:11px;color:var(--gray);font-style:italic;margin-bottom:10px">Tap a name to open in Messages:</p>${links}<div class="ma"><button class="btn btn-sm bcx" onclick="cm()">Done</button></div>`);}

// ── PEOPLE ──
function renderPeople(){
  if(role!=='mike')return;updateReqBanner();
  const search=(document.getElementById('people-search')?.value||'').toLowerCase();
  const sorted=[...S.people].sort((a,b)=>{const ar=hasOpenReqs(a.id),br=hasOpenReqs(b.id);if(ar&&!br)return -1;if(!ar&&br)return 1;return a.name.localeCompare(b.name);});
  const filtered=sorted.filter(p=>!search||p.name.toLowerCase().includes(search));
  document.getElementById('people-count').textContent=`${S.people.length} people on roster${search&&filtered.length!==S.people.length?' ('+filtered.length+' shown)':''}`;
  const list=document.getElementById('people-list');
  if(!S.people.length){list.innerHTML='<div style="color:#6b7280;font-size:13px;font-style:italic;padding:8px 0">No people yet.</div>';return;}
  if(!filtered.length){list.innerHTML='<div style="color:#6b7280;font-size:13px;font-style:italic;padding:8px 0">No matches found.</div>';return;}
  list.innerHTML=filtered.map(p=>{
    const bad=p.phone&&!pv(p.phone),hasReq=hasOpenReqs(p.id),reqCount=openReqs(p.id).length;
    return`<div class="pc"><div class="av">${p.initials}</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-weight:bold;font-size:14px">${p.name}</span>${p.notifyAll?'<span class="pill on" style="font-size:10px">All slots</span>':''}${hasReq?`<span style="font-size:10px;color:#dc2626;font-style:italic">${reqCount} open request${reqCount>1?'s':''}</span>`:''}</div><div style="font-size:12px;color:${bad?'#b5510a':'#6b7280'};margin:2px 0;font-style:italic">${p.phone||'No phone'}${bad?' \u26a0\ufe0f':''}</div><div class="dp">${SHORT.map((d,i)=>`<span class="pill ${p.days.includes(DAYS[i])?'on':''}" onclick="togDay(${p.id},'${DAYS[i]}')">${d}</span>`).join('')}</div></div><div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0;align-items:flex-end"><div style="display:flex;gap:5px"><button class="req-btn ${hasReq?'has':'none'}" onclick="openRequestModal(${p.id})" title="${hasReq?reqCount+' open request(s)':'No requests — tap to add'}">?</button><button class="btn btn-sm bcx" onclick="openEP(${p.id})">Edit</button><button class="btn btn-sm bdg" onclick="delP(${p.id})">\u2715</button></div></div></div>`;
  }).join('');
}
function openRequestModal(pid){const p=S.people.find(x=>x.id===pid);if(!p)return;const reqs=openReqs(pid);if(reqs.length===0){openNewRequestForm(pid);return;}const list=reqs.map(r=>`<div class="req-item"><div class="req-item-body"><div class="req-item-note">${r.note}</div><div class="req-item-date">Added ${r.date}</div></div><button class="req-close-btn" onclick="closeRequest(${r.id})">&#10003;</button></div>`).join('');sm(`<h3>&#10067; Requests \u2014 ${p.name}</h3>${list}<div class="ma"><button class="btn btn-sm bcx" onclick="cm()">Close</button><button class="btn btn-sm" onclick="openNewRequestForm(${pid})">+ New request</button></div>`);}
function openNewRequestForm(pid){const p=S.people.find(x=>x.id===pid);if(!p)return;const today=isoDate(new Date());sm(`<h3>&#10067; New Request \u2014 ${p.name}</h3><div class="f"><label>Request / follow-up note</label><textarea id="req-note" rows="3" placeholder="e.g. Looking for Mon/Wed mornings, asking about summer leagues..."></textarea></div><div class="ma"><button class="btn btn-sm bcx" onclick="openRequestModal(${pid})">Back</button><button class="btn btn-sm" onclick="saveRequest(${pid},'${today}')">Save request</button></div>`);setTimeout(()=>document.getElementById('req-note')?.focus(),100);}
function saveRequest(pid,date){const note=document.getElementById('req-note')?.value?.trim();if(!note){alert('Please enter a note.');return;}S.requests.push({id:S.nextId++,personId:pid,note,date,closed:false});save();cm();renderPeople();}
function closeRequest(reqId){const r=S.requests.find(x=>x.id===reqId);if(!r)return;r.closed=true;save();const remaining=openReqs(r.personId);if(remaining.length>0)openRequestModal(r.personId);else cm();renderPeople();}
function togDay(pid,day){if(role!=='mike')return;const p=S.people.find(x=>x.id===pid);if(!p)return;const i=p.days.indexOf(day);if(i>=0)p.days.splice(i,1);else p.days.push(day);save();renderPeople();}
function delP(id){if(role!=='mike')return;S.people=S.people.filter(p=>p.id!==id);save();renderPeople();}
function openEP(id){if(role!=='mike')return;const p=S.people.find(x=>x.id===id);if(!p)return;sm(`<h3>Edit Person</h3><div class="f"><label>Full name</label><input id="ep-n" value="${p.name}"></div><div class="f"><label>Phone</label><input id="ep-p" type="tel" value="${p.phone}" placeholder="5025551234" oninput="chph()"><div id="ep-ph" class="ph" style="${p.phone&&!pv(p.phone)?'display:block':''}">Digits only</div></div><div class="f"><label>Initials</label><input id="ep-i" value="${p.initials}" maxlength="3"></div><div class="f"><label><input type="checkbox" id="ep-a" style="width:auto;margin-right:6px" ${p.notifyAll?'checked':''}>Notify for all open slots</label></div><div class="ma"><button class="btn btn-sm bcx" onclick="cm()">Cancel</button><button class="btn btn-sm" onclick="svEP(${id})">Save</button></div>`);}
function chph(){const i=document.getElementById('ep-p'),h=document.getElementById('ep-ph');if(i&&h)h.style.display=i.value&&!pv(i.value)?'block':'none';}
function svEP(id){if(role!=='mike')return;const p=S.people.find(x=>x.id===id);if(!p)return;p.name=document.getElementById('ep-n').value.trim();p.phone=cp(document.getElementById('ep-p').value);p.initials=document.getElementById('ep-i').value.trim()||p.name.split(' ').map(w=>w[0]).join('').toUpperCase();p.notifyAll=document.getElementById('ep-a').checked;save();cm();renderPeople();}
function openAddPerson(prefill=''){if(role!=='mike')return;sm(`<h3>Add Person</h3><div class="f"><label>Full name</label><input id="p-n" placeholder="First Last" value="${prefill}"></div><div class="f"><label>Phone</label><input id="p-p" type="tel" placeholder="5025551234" oninput="chphn()"><div id="p-ph" class="ph">Digits only</div></div><div class="f"><label>Initials (auto-filled if blank)</label><input id="p-i" maxlength="3" placeholder="JT"></div><div class="f"><label><input type="checkbox" id="p-a" style="width:auto;margin-right:6px">Notify for all open slots</label></div><div class="ma"><button class="btn btn-sm bcx" onclick="cm()">Cancel</button><button class="btn btn-sm" onclick="addP()">Add</button></div>`);}
function chphn(){const i=document.getElementById('p-p'),h=document.getElementById('p-ph');if(i&&h)h.style.display=i.value&&!pv(i.value)?'block':'none';}
function addP(){if(role!=='mike')return;const n=document.getElementById('p-n').value.trim();if(!n)return;const p={id:S.nextId++,name:n,phone:cp(document.getElementById('p-p').value),initials:document.getElementById('p-i').value.trim()||n.split(' ').map(w=>w[0]).join('').toUpperCase(),days:[],notifyAll:document.getElementById('p-a').checked};S.people.push(p);save();cm();renderPeople();}

function openClaimModal(slotId){
  const claim=S.pendingClaims[slotId];if(!claim)return;
  const s=S.slots.find(x=>x.id===slotId);if(!s)return;
  sm(`<h3>&#128338; Pending Claim</h3>
    <div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:12px 14px;margin-bottom:16px">
      <div style="font-weight:bold;font-size:15px;color:#92400e">${claim.name}</div>
      <div style="font-size:12px;color:#d97706;margin-top:2px">${s.day} &nbsp;·&nbsp; ${sdsp(s)}</div>
      <div style="font-size:11px;color:#6b7280;margin-top:4px;font-style:italic">Claimed ${new Date(claim.claimedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>
      ${claim.note?`<div style="margin-top:8px;font-size:13px;color:#92400e;background:#fff;border-radius:4px;padding:7px 10px;border:1px solid #fed7aa">"${claim.note}"</div>`:''}
    </div>
    <p style="font-size:13px;color:#6b7280;margin-bottom:16px">Confirm to book this slot for ${claim.name}. Release to put it back as open.</p>
    <div class="ma">
      <button class="btn btn-sm bdg" onclick="releaseClaim(${slotId})">Release</button>
      <button class="btn btn-sm bcx" onclick="cm()">Later</button>
      <button class="btn btn-sm" style="background:#2d6a4f" onclick="confirmClaim(${slotId})">Confirm</button>
    </div>`);
}
function confirmClaim(slotId){
  const claim=S.pendingClaims[slotId];if(!claim)return;
  const s=S.slots.find(x=>x.id===slotId);if(!s)return;
  // Book the slot with their first name
  s.status='booked';
  s.roster=[claim.name];
  s.label=`Lesson — ${claim.name}`;
  // Remove from pending
  delete S.pendingClaims[slotId];
  // Prompt to add to people
  save();cm();renderSchedule();
  setTimeout(()=>{
    if(confirm(`Add ${claim.name} to your People roster?\nYou can fill in their details (last name, phone) there.`)){
      // Pre-open add person modal with first name filled
      openAddPerson(claim.name);
    }
  },200);
}

function releaseClaim(slotId){
  if(!confirm('Release this claim and return the slot to open?'))return;
  delete S.pendingClaims[slotId];
  save();cm();renderSchedule();
}

function shareOpenSlots(){
  const thisMonday=mondayOf(new Date());
  const nextMonday=addDays(thisMonday,7);
  // Check for open slots this week and next
  const hasOpen=S.slots.some(s=>{
    if(ss(s)!=='available')return false;
    // Check not on vacation
    const dayIdx=DAYS.indexOf(s.day);
    if(dayIdx===-1)return false;
    const thisDate=isoDate(addDays(thisMonday,dayIdx));
    const nextDate=isoDate(addDays(nextMonday,dayIdx));
    const thisVac=S.lifeEvents.some(e=>e.type==='vacation'&&!e.archived&&thisDate>=e.startDate&&thisDate<=e.endDate);
    const nextVac=S.lifeEvents.some(e=>e.type==='vacation'&&!e.archived&&nextDate>=e.startDate&&nextDate<=e.endDate);
    return !thisVac||!nextVac;
  });
  if(!hasOpen){
    sm(`<h3>No Open Slots</h3>
      <p style="font-size:13px;color:#6b7280;margin-bottom:16px;font-style:italic">There are no open lesson slots for this week or next — nothing to share right now.</p>
      <div class="ma"><button class="btn btn-sm bcx" onclick="cm()">OK</button></div>`);
    return;
  }
  const link='https://mlindsayky-rgb.github.io/schedule/open.html';
  const msg=`It's Mike Lindsay, I have some open lesson slots available this week and next. Click the link to see what works for you: ${link}`;
  const enc=encodeURIComponent(msg);
  sm(`<h3>&#128279; Share Availability</h3>
    <div class="mp">${msg}</div>
    <p style="font-size:11px;color:var(--gray);font-style:italic;margin-bottom:14px">Opens in Messages — pick who to send to:</p>
    <a href="sms:?body=${enc}" style="display:block;text-align:center;background:#2d6a4f;color:#fff;padding:12px;border-radius:6px;font-family:Georgia,serif;font-weight:600;font-size:14px;text-decoration:none;margin-bottom:8px">Open in Messages &#8250;</a>
    <div class="ma"><button class="btn btn-sm bcx" onclick="cm()">Cancel</button></div>`);
}
function sm(html){const o=document.getElementById('modal');o.style.display='flex';o.innerHTML=`<div class="md" onclick="event.stopPropagation()">${html}</div>`;}
function cm(){document.getElementById('modal').style.display='none';_ps=[];}
</script>
</body>
</html>
