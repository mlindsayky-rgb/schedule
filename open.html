<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Lesson — Mike</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;font-size:14px;color:#1a1a2e;background:#faf8f4;min-height:100vh}
:root{
  --navy:#1a1a2e;--navy-mid:#2d2d5e;
  --green:#2d6a4f;--green-soft:#40916c;--green-pale:#d8f3dc;
  --amber:#b5510a;--amber-pale:#fef3e2;
  --cream:#faf8f4;--gray:#6b7280;--border:#ddd8d0;--white:#ffffff;
}
.header{background:var(--navy);padding:20px 20px 16px;text-align:center}
.header h1{color:#fff;font-size:20px;font-weight:bold;letter-spacing:.04em}
.header p{color:rgba(255,255,255,.6);font-size:13px;font-style:italic;margin-top:4px}
.container{max-width:480px;margin:0 auto;padding:16px}
.week-section{margin-bottom:24px}
.week-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gray);font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.slot-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 4px rgba(26,26,46,.05)}
.slot-card.pending{background:#fff7ed;border-color:#fed7aa}
.slot-info{flex:1}
.slot-day{font-weight:bold;font-size:14px;color:var(--navy)}
.slot-time{font-size:12px;color:var(--gray);font-style:italic;margin-top:2px}
.slot-pending-name{font-size:11px;color:#d97706;margin-top:3px;font-style:italic}
.claim-btn{background:var(--green-soft);color:#fff;border:none;border-radius:6px;padding:9px 18px;font-size:13px;font-family:Georgia,serif;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.claim-btn:hover{background:var(--green)}
.claim-btn:disabled{background:#d1d5db;cursor:default}
.empty-week{color:var(--gray);font-size:13px;font-style:italic;padding:8px 0}
/* CLAIM MODAL */
.mo{position:fixed;inset:0;background:rgba(26,26,46,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.md{background:var(--cream);border-radius:10px;padding:1.6rem;width:100%;max-width:360px;border:1.5px solid var(--border);box-shadow:0 10px 40px rgba(26,26,46,.25)}
.md h3{font-size:18px;font-weight:bold;color:var(--navy);margin-bottom:6px}
.md .slot-detail{font-size:13px;color:var(--gray);font-style:italic;margin-bottom:18px}
.f label{font-size:11px;color:var(--gray);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
input{padding:10px 12px;border:1.5px solid #c5c0b8;border-radius:5px;font-size:15px;font-family:Georgia,serif;background:#fff;color:var(--navy);width:100%}
input:focus{outline:2px solid var(--navy);border-color:var(--navy)}
.ma{display:flex;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:5px;cursor:pointer;font-size:13px;font-family:Georgia,serif;font-weight:600;border:none;transition:background .15s;flex:1}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-mid)}
.btn-cancel{background:#4b5563;color:#fff}
.btn-cancel:hover{background:#374151}
/* SUCCESS */
.success-screen{text-align:center;padding:40px 20px}
.success-icon{font-size:48px;margin-bottom:16px}
.success-title{font-size:20px;font-weight:bold;color:var(--navy);margin-bottom:8px}
.success-msg{font-size:14px;color:var(--gray);line-height:1.6}
/* LOADING */
.loading{text-align:center;padding:40px;color:var(--gray);font-style:italic}
.spinner{width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.note{background:#f0ece4;border-radius:6px;padding:10px 14px;font-size:12px;color:var(--gray);font-style:italic;margin-bottom:16px;border-left:3px solid var(--green-soft)}
</style>
</head>
<body>
<div class="header">
  <h1>Book a Lesson</h1>
  <p>Available slots this week and next</p>
</div>

<div class="container">
  <div id="content"><div class="loading"><div class="spinner"></div>Loading available slots...</div></div>
</div>

<div id="modal" class="mo" style="display:none">
  <div class="md">
    <h3>Claim this slot</h3>
    <div class="slot-detail" id="modal-slot-detail"></div>
    <div class="f" style="margin-bottom:14px">
      <label>Your first name</label>
      <input id="claim-name" placeholder="e.g. Sarah" maxlength="30" autocomplete="given-name">
    </div>
    <div class="f">
      <label>Note for Mike <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#9ca3af">(optional)</span></label>
      <input id="claim-note" placeholder="e.g. I have Tuesday 10am and want to move it" maxlength="120">
    </div>
    <div class="ma">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitClaim()">Claim slot</button>
    </div>
  </div>
</div>

<script>
const SURL='https://vztyrxqdnqzvkfwfnipt.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6dHlyeHFkbnF6dmtmd2ZuaXB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODc3NDAsImV4cCI6MjA5NDY2Mzc0MH0.HCVqqQ_i6ETY8EL19Is1pHVn2qj8hFXqMnCd4ifH0E8';
const TBL='schedule_data';
const H={'apikey':SKEY,'Authorization':`Bearer ${SKEY}`,'Content-Type':'application/json'};

const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'];

function mtd(m){const h=Math.floor(m/60),mm=m%60,ap=h<12?'AM':'PM',h12=h===0?12:h>12?h-12:h;return mm===0?`${h12} ${ap}`:`${h12}:${String(mm).padStart(2,'0')} ${ap}`;}
function sdsp(s){return`${mtd(s.startM)}\u2013${mtd(s.endM)}`;}
function mondayOf(d){const dt=new Date(d);const dow=dt.getDay();const diff=dow===0?-6:1-dow;dt.setDate(dt.getDate()+diff);dt.setHours(0,0,0,0);return dt;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtDate(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function isoDate(d){return d.toISOString().slice(0,10);}

let slots=[];
let pendingClaims={};
let lifeEvents=[];
let pto={};
let claimingSlotId=null;

async function dbGet(k){
  try{
    const r=await fetch(`${SURL}/rest/v1/${TBL}?key=eq.${encodeURIComponent(k)}&select=value`,{headers:H});
    const d=await r.json();
    return(d&&d.length)?JSON.parse(d[0].value):null;
  }catch(e){return null;}
}

async function dbSave(k,v){
  const body=JSON.stringify({key:k,value:JSON.stringify(v)});
  try{
    const r=await fetch(`${SURL}/rest/v1/${TBL}?key=eq.${encodeURIComponent(k)}`,{
      method:'PATCH',headers:{...H,'Prefer':'return=representation'},body
    });
    if(r.ok)return true;
    // fallback insert
    const ins=await fetch(`${SURL}/rest/v1/${TBL}`,{method:'POST',headers:{...H,'Prefer':'return=minimal'},body});
    return ins.ok;
  }catch(e){return false;}
}


function isVacationDay(dateStr){
  return lifeEvents.some(e=>
    e.type==='vacation' &&
    !e.archived &&
    e.startDate && e.endDate &&
    dateStr >= e.startDate &&
    dateStr <= e.endDate
  );
}

function isPTODay(dateStr){
  if(!pto||!pto.active||!pto.startDate||!pto.endDate)return false;
  return dateStr >= pto.startDate && dateStr <= pto.endDate &&
    new Date(dateStr+'T12:00:00').getDay()>=1 &&
    new Date(dateStr+'T12:00:00').getDay()<=5;
}
function slotStatus(s){
  if(['adult-team','hp-clinic','blocked'].includes(s.type))return'fixed';
  if(s.status==='blocked')return'blocked';
  if(s.status==='booked')return'booked';
  const cap={private:1,group:4,liveball:8,camp:12}[s.type]||1;
  const f=s.roster?.length||0;
  if(f===0)return'available';
  if(f>=cap)return'full';
  return'partial';
}

// Get Mon-Sun for this week and next
function getWeekDays(mondayDate){
  return DAYS.map((name,i)=>({
    name,
    date:isoDate(addDays(mondayDate,i))
  }));
}

async function load(){
  const [slotsData, claimsData, lifeEventsData, ptoData] = await Promise.all([
    dbGet('slots'),
    dbGet('pendingClaims'),
    dbGet('lifeEvents'),
    dbGet('pto')
  ]);

  slots = slotsData || [];
  pendingClaims = claimsData || {};
  lifeEvents = lifeEventsData || [];
  pto = ptoData || {active:false,startDate:null,endDate:null};

  render();
}

function getOpenSlotsForWeek(weekDays){
  return weekDays.flatMap(({name,date})=>{
    if(isVacationDay(date)||isPTODay(date))return[]; // skip vacation and PTO days
    return slots
      .filter(s=>s.day===name&&slotStatus(s)==='available')
      .map(s=>({...s,date,dayName:name}));
  }).sort((a,b)=>{
    if(a.date!==b.date)return a.date>b.date?1:-1;
    return a.startM-b.startM;
  });
}

function render(){
  const thisMonday=mondayOf(new Date());
  const nextMonday=addDays(thisMonday,7);
  const thisWeekDays=getWeekDays(thisMonday);
  const nextWeekDays=getWeekDays(nextMonday);
  const thisWeekSlots=getOpenSlotsForWeek(thisWeekDays);
  const nextWeekSlots=getOpenSlotsForWeek(nextWeekDays);

  const thisStart=fmtDate(thisMonday),thisEnd=fmtDate(addDays(thisMonday,6));
  const nextStart=fmtDate(nextMonday),nextEnd=fmtDate(addDays(nextMonday,6));

  let html=`<div class="note">Tap a slot to claim it. Mike will confirm your booking shortly.</div>`;

  html+=`<div class="week-section">
    <div class="week-label">This week &nbsp;·&nbsp; ${thisStart} – ${thisEnd}</div>
    ${renderSlots(thisWeekSlots)}
  </div>`;

  html+=`<div class="week-section">
    <div class="week-label">Next week &nbsp;·&nbsp; ${nextStart} – ${nextEnd}</div>
    ${renderSlots(nextWeekSlots)}
  </div>`;

  document.getElementById('content').innerHTML=html;
}

function renderSlots(openSlots){
  if(!openSlots.length)return`<div class="empty-week">No open slots this week.</div>`;
  return openSlots.map(s=>{
    const claim=pendingClaims[s.id];
    const isPending=!!claim;
    return`<div class="slot-card ${isPending?'pending':''}">
      <div class="slot-info">
        <div class="slot-day">${s.dayName}</div>
        <div class="slot-time">${sdsp(s)}</div>
        ${isPending?`<div class="slot-pending-name">Pending — ${claim.name}</div>`:''}
      </div>
      <button class="claim-btn" ${isPending?'disabled':''} onclick="openClaim(${s.id},'${s.dayName}','${sdsp(s)}')">
        ${isPending?'Pending':'Claim'}
      </button>
    </div>`;
  }).join('');
}

function openClaim(slotId,day,time){
  claimingSlotId=slotId;
  document.getElementById('modal-slot-detail').textContent=`${day} · ${time}`;
  document.getElementById('claim-name').value='';
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>document.getElementById('claim-name').focus(),100);
}

function closeModal(){
  document.getElementById('modal').style.display='none';
  claimingSlotId=null;
}

async function submitClaim(){
  const name=document.getElementById('claim-name').value.trim();
  if(!name){document.getElementById('claim-name').focus();return;}

  const btn=document.querySelector('.btn-primary');
  btn.textContent='Saving...';btn.disabled=true;

  // Save claim to pendingClaims
  const note=document.getElementById('claim-note').value.trim();
  pendingClaims[claimingSlotId]={
    name,
    note:note||'',
    slotId:claimingSlotId,
    claimedAt:new Date().toISOString()
  };

  const ok=await dbSave('pendingClaims',pendingClaims);

  if(ok){
    closeModal();
    // Show success screen
    document.getElementById('content').innerHTML=`
      <div class="success-screen">
        <div class="success-icon">✅</div>
        <div class="success-title">You're all set, ${name}!</div>
        <div class="success-msg">Mike will confirm your lesson shortly.<br><br>You can close this page.</div>
      </div>`;
  } else {
    btn.textContent='Claim slot';btn.disabled=false;
    alert('Something went wrong — please try again.');
  }
}

// Allow Enter key to submit
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&claimingSlotId)submitClaim();});

load();
</script>
</body>
</html>
